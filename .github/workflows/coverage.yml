name: Coverage

# Separate from deploy.yml on purpose: a rollout should not wait on report generation,
# and a coverage step must never be able to hold up a deploy. The cost is running the
# suite twice per push to main, which buys a deploy pipeline that stays lean.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # append to the coverage-history branch
  pages: write
  id-token: write

concurrency:
  group: coverage-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Nornis.sln
      - run: dotnet build Nornis.sln --no-restore

      # The format gate also runs here, not only on pull requests. Twice now a dependency
      # bump has widened an analyzer's reach and turned main red without anything noticing:
      # ci.yml is `on: pull_request`, so a push to main never runs it, and the break only
      # surfaces on whichever PR opens next. Deploy must not wait on formatting, so this
      # lives in the workflow that already runs the full suite on push.
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Test with coverage
        run: >
          dotnet test Nornis.sln --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/raw

      - run: dotnet tool restore

      - name: Generate reports
        run: |
          dotnet reportgenerator \
            "-reports:artifacts/coverage/raw/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage/report" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub;JsonSummary" \
            "-title:Nornis coverage" \
            -verbosity:Warning
          cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # The same floors the PR gate applies, on main. A PR gate alone would let a
      # direct push — or a merge whose base moved underneath it — land below a floor
      # and stay there unnoticed until the next PR blamed the wrong change.
      - name: Coverage floors
        shell: pwsh
        run: ./scripts/coverage-gate.ps1

      # Risk-weighted, where the coverage percentage above is not: this ranks methods by
      # complexity against coverage, so an uncovered visibility branch and an uncovered
      # DTO mapper stop looking like the same emergency. The list is the test-writing
      # backlog. Never a gate — see the steering doc.
      - name: CRAP hotspots
        shell: pwsh
        run: |
          ./scripts/crap-report.ps1
          Get-Content artifacts/coverage/crap.md | Add-Content $env:GITHUB_STEP_SUMMARY

      # The exposure decision, enforced here rather than trusted: the full report embeds
      # annotated source and stays an artifact. The published site gets aggregates only —
      # not because the source is secret (the repo is public) but because a dashboard read
      # at a glance should not be a source dump.
      - name: Attach the full report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/report
          retention-days: 30

      # The authorization suite's size, charted beside coverage because it answers a
      # different question: not what fraction of the code is exercised, but how much of a
      # deliberately enumerated surface is nailed down. The count only goes up — every
      # [auth]-flagged change adds to it — so a flat line is the signal, not a healthy number.
      - name: Count the authorization suite
        run: |
          dotnet test --no-build --filter "TestCategory=Authorization" \
            --logger "trx;LogFilePrefix=auth" --results-directory artifacts/auth || true
          # LogFilePrefix, not LogFileName: with a fixed name every project overwrites the
          # same file and the count silently becomes whichever project ran last.
          # grep over the XML rather than parsing it — the attribute is stable, and this
          # step must never be the thing that fails the run.
          count=$(grep -ho 'executed="[0-9]*"' artifacts/auth/*.trx 2>/dev/null \
            | grep -o '[0-9]*' | awk '{ total += $1 } END { print total + 0 }')
          echo "AUTH_SUITE_COUNT=${count:-0}" >> "$GITHUB_ENV"
          echo "Authorization suite: ${count:-0} tests" >> "$GITHUB_STEP_SUMMARY"

      # One file, one commit, no checkout dance: read the existing history straight out of
      # the remote branch, append, and write a new commit with plumbing. The branch is an
      # orphan and stays a single file, so nothing here needs a working tree.
      - name: Append to the coverage history
        run: |
          entry=$(jq -c \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --argjson auth "${AUTH_SUITE_COUNT:-0}" '
            {
              date: $date,
              sha: $sha,
              authorizationTests: $auth,
              line: .summary.linecoverage,
              branch: .summary.branchcoverage,
              assemblies: [.coverage.assemblies[] | {name: .name, line: .coverage, branch: .branchcoverage}]
            }' artifacts/coverage/report/Summary.json)

          # commit-tree writes a commit object directly, so it needs an identity just as
          # `git commit` would — the runner has none by default.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin coverage-history 2>/dev/null; then
            git show FETCH_HEAD:history.json > old.json
            parent="-p FETCH_HEAD"
          else
            echo '[]' > old.json
            parent=""
          fi

          jq --argjson e "$entry" '. + [$e]' old.json > history.json

          blob=$(git hash-object -w history.json)
          tree=$(printf '100644 blob %s\thistory.json\n' "$blob" | git mktree)
          # shellcheck disable=SC2086
          commit=$(git commit-tree "$tree" $parent -m "Coverage for ${GITHUB_SHA:0:7}")
          git push origin "$commit:refs/heads/coverage-history"

      - name: Assemble the dashboard
        run: |
          mkdir -p _site
          # Everything in ci/pages, not a list of extensions — the brand assets are part
          # of the site, and a glob that names types silently drops whatever it forgot.
          cp -r ci/pages/. _site/
          cp history.json _site/history.json
          # Method names only — no source, no line numbers. Consistent with the full
          # report staying an artifact.
          cp artifacts/coverage/crap.json _site/crap.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Split from collect so a Pages misconfiguration cannot cost the coverage run its
  # history append or its report artifact. Needs Settings → Pages → Source: GitHub
  # Actions; until that is set, this job is the only part that fails.
  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
