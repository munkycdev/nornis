name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # Azure OIDC login
  contents: read

env:
  ACR: acrnornis
  RESOURCE_GROUP: rg-nornis

jobs:
  # Tests and image builds run in parallel; only the rollout below is gated on tests.
  # Images pushed for a failing commit are tagged but never deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Nornis.sln
      - run: dotnet build Nornis.sln --no-restore
      - run: dotnet test Nornis.sln --no-build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR"

      - uses: docker/setup-buildx-action@v3

      # One shared build stage compiles the solution once; the second and third
      # targets reuse it from the builder's local cache. The GHA cache keeps the
      # NuGet-restore and publish layers warm between pushes.
      - name: Build and push images
        run: |
          for svc in api web worker; do
            docker buildx build \
              --target "$svc" \
              --tag "$ACR.azurecr.io/nornis-$svc:${{ github.sha }}" \
              --tag "$ACR.azurecr.io/nornis-$svc:main-latest" \
              --build-arg IMAGE_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
              --build-arg IMAGE_REVISION="${{ github.sha }}" \
              --build-arg BUILD_NUMBER="${{ github.run_number }}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --push \
              .
          done

  # EF migrations are applied manually, before pushing a commit that needs them:
  #   dotnet ef database update --project src/Nornis.Infrastructure \
  #     --startup-project src/Nornis.Api --connection "<prod connection string>"
  # They must stay additive — the old revision keeps serving until the rollout below.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container apps
        run: |
          pids=()
          for svc in api web worker; do
            az containerapp update \
              --name "ca-nornis-$svc" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$ACR.azurecr.io/nornis-$svc:${{ github.sha }}" \
              -o none &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

      # Part of O1 (see docs/plans/operational-hardening.md): until this existed, the job
      # ended the moment `az containerapp update` returned and nothing confirmed the new
      # revision came up. On 2026-08-01 a broken image build left four commits undeployed
      # while the run summary still looked half-green.
      - name: Verify the rollout
        run: |
          # Gate on /health only. It means one thing — is this deploy broken — so it is the
          # honest pass/fail for a rollout. /status covers dependencies the deploy does not
          # control, and failing a release because Service Bus is having a moment would
          # train everyone to ignore a red pipeline.
          deadline=$((SECONDS + 180))
          until [ "$(curl -fsS -o /dev/null -w '%{http_code}' https://api.nornis.app/health || true)" = "200" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              # /health names what is failing, so this can say which of the two very
              # different failures happened instead of only that three minutes elapsed.
              # Still fails either way — a deploy sitting behind an unapplied migration is
              # broken, it is just broken in a way with a known five-line remedy.
              body=$(curl -sS https://api.nornis.app/health || true)
              if echo "$body" | grep -q 'pending-migrations'; then
                echo "::error::Migration not applied. Run \`dotnet ef database update\` against prod — docs/runbooks/migration-missed.md — then re-run this job."
              else
                echo "::error::API /health did not return 200 within 3 minutes of the rollout."
              fi
              echo "$body"
              curl -sS -i -o /dev/null -w 'status: %{http_code}\n' https://api.nornis.app/health || true
              exit 1
            fi
            sleep 5
          done
          echo "API is serving."

      - name: Warm the new revision
        run: |
          # The first request after a revision swap pays for cold connection pools and JIT.
          # api and web run at minReplicas=1, so a swap is the only time they are ever cold —
          # spending that cost here means the first human request does not, and stops a
          # healthy-but-cold system from rendering as a red status page.
          curl -fsS -o /dev/null https://nornis.app/ || true
          for _ in 1 2 3; do
            curl -fsS -o /dev/null https://api.nornis.app/status || true
            sleep 2
          done

      - name: Report endpoints
        run: |
          echo "web: https://$(az containerapp show -g $RESOURCE_GROUP -n ca-nornis-web --query properties.configuration.ingress.fqdn -o tsv)" >> $GITHUB_STEP_SUMMARY
          echo "api: https://$(az containerapp show -g $RESOURCE_GROUP -n ca-nornis-api --query properties.configuration.ingress.fqdn -o tsv)" >> $GITHUB_STEP_SUMMARY
          {
            echo ''
            echo '### Post-deploy status'
            echo '```json'
            curl -sS https://api.nornis.app/status || true
            echo ''
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
