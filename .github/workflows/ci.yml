name: CI

# PRs only — pushes to main run the test job inside deploy.yml instead.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Belt to NuGet Audit's braces. Restore already fails this build on a vulnerable
      # package — audit's NU1901-NU1904 are errors under TreatWarningsAsErrors, which is
      # why Nornis.Infrastructure and Nornis.Web carry explicit pins past advisories in
      # their transitive graphs. This step adds a legible report of what was found, and
      # keeps working if audit is ever narrowed or switched off.
      #
      # It greps rather than trusting the exit code on purpose: `dotnet list package
      # --vulnerable` reports findings and still exits 0, so a naive step passes green
      # while printing the vulnerabilities it just found.
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable packages found — see the log above."
            exit 1
          fi
          echo "No vulnerable packages."

      # Coverage is collected on every PR and reported, never gated. The steering doc
      # commits Nornis to coverage as signal rather than a bar to clear, so this step's
      # job is to put the number where a reviewer sees it without changing whether the
      # PR can merge. Floors — on Domain and Application only — arrive in phase 4, set
      # from observed history rather than aspiration.
      - name: Test
        run: >
          dotnet test --solution Nornis.sln --no-build
          --coverage --coverage-output-format cobertura
          --coverage-settings codecoverage.runsettings
          --results-directory artifacts/coverage/raw

      - name: Restore tools
        run: dotnet tool restore

      - name: Coverage summary
        # Runs even when tests fail: a failing PR is exactly when knowing what the tests
        # did cover is useful, and this step can never be the thing that fails the run.
        if: always()
        continue-on-error: true
        run: |
          dotnet reportgenerator \
            "-reports:artifacts/coverage/raw/**/*.cobertura.xml" \
            "-targetdir:artifacts/coverage/summary" \
            "-reporttypes:MarkdownSummaryGithub;JsonSummary" \
            -verbosity:Warning
          cat artifacts/coverage/summary/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Phase 4: floors on Domain and Application, and nothing else. Unlike the summary
      # above this one is allowed to fail the run — that is the entire point of it — but
      # only for an assembly whose floor is actually set, and none are yet. Until a number
      # goes into coverage-thresholds.json this step passes and reports, which is what
      # makes turning it on later a one-line edit rather than a change to CI.
      #
      # Not `if: always()`: a run whose tests failed has coverage numbers that mean
      # nothing, and failing it a second time for a floor would bury the real cause.
      - name: Coverage floors
        shell: pwsh
        run: ./scripts/coverage-gate.ps1 -SummaryPath artifacts/coverage/summary/Summary.json

      # Phase 5 of the test-quality plan: the authorization suite as its own green mark
      # rather than a share of a coverage percentage. The steering doc enumerates the surface
      # — anonymous rejection, non-member denial, GMOnly invisibility, observer immutability,
      # private-content scoping, Ask retrieval — and this is the spiritual successor to
      # Chronicis's 100%: total coverage of a deliberately enumerated surface, where the
      # count only goes up.
      #
      # Runs even when the full suite above failed, because "did the authorization tests
      # still pass" is the first question worth answering about a red build. It re-runs
      # tests the previous step already ran; that is the price of a separate mark, and the
      # suite is a fraction of the whole.
      # --ignore-exit-code 8: exit 8 is "this project matched zero tests", and Worker.Tests
      # has no authorization surface — under VSTest that was a warning, under MTP it fails
      # the run. Only 8 is ignored, so a genuine test failure (exit 2) still goes red. The
      # residual risk — the category renames and every project matches zero, leaving a green
      # tick on nothing — is what the coverage workflow's count chart exists to catch.
      - name: Authorization suite
        if: always()
        run: dotnet test --solution Nornis.sln --no-build --filter "TestCategory=Authorization" --ignore-exit-code 8

      # A real check since 2026-07-29: the tree was formatted in one mechanical commit and
      # .editorconfig no longer enforces line endings or BOMs (git owns those — the old rules
      # made this check unsatisfiable across Windows dev machines and this Linux runner).
      # If this step fails, run `dotnet format` locally and commit what it changes.
      - name: Format Check
        run: dotnet format --verify-no-changes --no-restore
