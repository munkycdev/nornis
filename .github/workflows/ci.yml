name: CI

# PRs only — pushes to main run the test job inside deploy.yml instead.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      # KNOWN NO-OP. Bare `dotnet format` APPLIES fixes to the runner's working tree and exits 0,
      # so this step cannot fail and the changes are discarded with the runner — it verifies
      # nothing today.
      #
      # The fix is `--verify-no-changes`, but it cannot be turned on yet: the repo has never
      # satisfied the analyzers, so it currently reports ~37,000 findings across 897 files
      # (mostly IDE0161 file-scoped namespaces, plus CHARSET/BOM inconsistencies that even
      # `dotnet format whitespace` trips on). Flipping the flag would fail every PR immediately.
      #
      # Landing it needs its own commit: run `dotnet format` across the tree, commit the churn
      # alone so it is reviewable, then change this line. Doing it inside a feature branch would
      # bury the real diff. Tracked in docs/future-features.md.
      - name: Format Check
        run: dotnet format
