# Dependency patching (O5). The premise is that this repo's existing gates —
# warnings-as-errors, the full suite, the format check, and now the vulnerability scan
# in ci.yml — are strong enough that a routine bump can be read and merged quickly.
# Automation that opens PRs nobody dares merge is worse than no automation.
version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine drift. Majors stay separate: they are the ones that
      # change behaviour, and each deserves its own read and its own revert.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ImageSharp 4 added a build-time licence check: with no key, no licence file and
      # no sixlabors.lic in the workspace, the compile fails outright. The split licence
      # grants free use under 1M USD annual gross revenue and this project qualifies, but
      # v4 enforces regardless — free use still needs a key from sixlabors.com, which
      # means an account plus a secret in Actions and on every dev machine.
      #
      # Decided 2026-08-03 to stay on 3.1.x, which is maintained (3.1.12 shipped
      # 2025-10-29) and carries the same licence terms without the enforcement. Patches
      # and minors still come through; only the major is ignored, so this pin does not
      # cost security updates on the 3.1 line.
      #
      # To revisit: either take a key, or drop the dependency — the whole usage is
      # Image.Load, Clone(c => c.Crop(...)) and SaveAsPng in MapRefinement.CropTiles,
      # and SkiaSharp is MIT with no threshold to re-check as this grows.
      - dependency-name: SixLabors.ImageSharp
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
    # Note for whoever takes the first major bumps here: every run currently warns that
    # checkout@v4, setup-dotnet@v4, azure/login@v2 and setup-buildx-action@v3 target
    # Node 20 and are being forced onto Node 24. Those majors are the fix. Read each
    # changelog — action majors change inputs, and azure/login in particular gates the
    # OIDC deploy — rather than accepting all four at once.
